<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping list</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Shopping list</h1>

      <form id="add-form">
        <label for="item-input" class="visually-hidden">New item</label>
        <input id="item-input" type="text" placeholder="Milk, bread, apples…" autocomplete="off" />
        <button type="submit">Add</button>
      </form>

      <ul id="list"></ul>

      <p id="count"></p>
    </main>
  </body>
</html>
