[package]
name = "tic"
version = "0.1.0"
edition = "2021"
description = "Tic — a tiny, statically-typed, C-like teaching language"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }   # CLI (§7)
miette = { version = "7", features = ["fancy"] }  # diagnostics rendering (§5.6)
rustyline = "14"                                   # REPL (used from phase 8)

[profile.release]
lto = true
